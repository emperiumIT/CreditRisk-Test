name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Qualité du code (Ruff)
        run: ruff check .

      - name: Tests + couverture
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=reports/junit.xml

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            coverage.xml
            reports/junit.xml
